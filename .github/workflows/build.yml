name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools and Platform
        run: |
          sdkmanager "build-tools;34.0.0"
          sdkmanager "platforms;android-34"
          ls -la $ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2 || echo "aapt2 not found at ANDROID_SDK_ROOT"
          ls -la /usr/local/lib/android/sdk/build-tools/34.0.0/aapt2 || echo "aapt2 not found at default path"

      - name: Create symlink for aapt2
        run: |
          sudo mkdir -p /opt/android-sdk/build-tools/34.0.0/
          sudo ln -s $ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2 /opt/android-sdk/build-tools/34.0.0/aapt2 || true
          sudo ln -s /usr/local/lib/android/sdk/build-tools/34.0.0/aapt2 /opt/android-sdk/build-tools/34.0.0/aapt2 || true
          ls -la /opt/android-sdk/build-tools/34.0.0/aapt2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Create local.properties
        working-directory: AndroidDevAgent
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Grant execute permission for gradlew
        working-directory: AndroidDevAgent
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: AndroidDevAgent
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: AndroidDevAgent/app/build/outputs/apk/debug/*.apk
          retention-days: 30
