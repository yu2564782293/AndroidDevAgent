name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          echo "y" | sdkmanager "build-tools;34.0.0"
          echo "y" | sdkmanager "platforms;android-34"

      - name: Verify AAPT2
        run: ls -la $ANDROID_HOME/build-tools/34.0.0/aapt2

      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > AndroidDevAgent/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x AndroidDevAgent/gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build Debug APK
        working-directory: AndroidDevAgent
        run: |
          rm -rf ~/.gradle/caches/transforms-3
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: AndroidDevAgent/app/build/outputs/apk/debug/*.apk
          retention-days: 30